{% extends 'base/base.html' %}

{% block title %}Customers - StocketBucket{% endblock %}
{% block page_title %}Customers{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-xl font-semibold text-gray-900">Customer Management</h1>
  <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">Add Customer</button>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <table class="w-full">
    <thead class="bg-gray-100 border-b">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Name</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Email</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Phone</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Orders</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr class="border-b hover:bg-gray-50">
        <td class="px-6 py-4 text-sm font-medium text-gray-900">John Doe</td>
        <td class="px-6 py-4 text-sm text-gray-600">john@example.com</td>
        <td class="px-6 py-4 text-sm text-gray-600">+1 (555) 123-4567</td>
        <td class="px-6 py-4 text-sm text-gray-600">5</td>
        <td class="px-6 py-4 text-sm space-x-2">
          <button class="text-blue-600 hover:text-blue-800">Edit</button>
          <button class="text-red-600 hover:text-red-800">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
{% endblock %}
