{% extends 'base/base.html' %}

{% block title %}Orders - StocketBucket{% endblock %}
{% block page_title %}Orders{% endblock %}

{% block content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-xl font-semibold text-gray-900">Order Management</h1>
  <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition">New Order</button>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <table class="w-full">
    <thead class="bg-gray-100 border-b">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Order ID</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Customer</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Date</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Amount</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Status</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-700 uppercase">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr class="border-b hover:bg-gray-50">
        <td class="px-6 py-4 text-sm font-medium text-gray-900">ORD-001</td>
        <td class="px-6 py-4 text-sm text-gray-600">John Doe</td>
        <td class="px-6 py-4 text-sm text-gray-600">2026-06-25</td>
        <td class="px-6 py-4 text-sm text-gray-600">$499.99</td>
        <td class="px-6 py-4 text-sm"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded">Processing</span></td>
        <td class="px-6 py-4 text-sm space-x-2">
          <button class="text-blue-600 hover:text-blue-800">View</button>
          <button class="text-red-600 hover:text-red-800">Cancel</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
{% endblock %}
